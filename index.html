<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#110d22">
<title>Guess The Track</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#110d22}
body{
 min-height:100vh;padding:14px;color:#fff;font-family:Arial,Helvetica,sans-serif;
 display:flex;justify-content:center;align-items:flex-start
}
.game{
 width:min(100%,520px);background:linear-gradient(180deg,#281d45,#211737);
 border-radius:30px;padding:25px 18px 22px;box-shadow:0 18px 50px rgba(0,0,0,.38);
 text-align:center
}
.headphones{font-size:58px;line-height:1}
h1{margin:10px 0 14px;font-size:32px}
.sub{font-size:15px;line-height:1.45;color:#ddd3e9;margin:0 4px 20px}
button{
 width:100%;border:0;border-radius:18px;padding:17px 12px;
 font-size:18px;font-weight:900;cursor:pointer;margin-top:12px
}
.scan{background:#ffd166;color:#18120a}
.reveal{background:#fa6f9d;color:#1b1020}
.secondary{background:#fff;color:#211737}
.cancel{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3)}
.hidden{display:none!important}

.amazon-shell{
 position:relative;height:108px;width:100%;overflow:hidden;
 border-radius:20px;border:2px solid #d6a532;background:#090b0d;margin-top:8px
}
.amazon-shell iframe{
 position:absolute;left:0;top:-220px;width:100%;height:352px;border:0;display:block
}
.listen-cover{
 position:absolute;z-index:4;left:94px;right:0;top:0;bottom:0;pointer-events:none;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(180deg,#ffd66a,#ffbd3f);color:#18120a;
 font-size:24px;font-weight:900;border-radius:0 18px 18px 0
}
.helper{font-size:12px;color:#cfc5dc;margin:10px 0 4px}

#answer{
 margin-top:15px;padding:20px 14px;border-radius:20px;background:#fff8eb;color:#1c1530
}
.year{font-size:52px;font-weight:900;color:#d14d72}
.artist{font-size:23px;font-weight:900;margin-top:6px}
.song{font-size:20px;font-weight:800;margin-top:5px;color:#6b3faf}

#reader{
 width:100%;overflow:hidden;border-radius:20px;background:#000;margin-top:15px;
 min-height:260px
}
.scanner-title{font-size:22px;font-weight:900;margin-top:8px}
.status{font-size:13px;color:#d9d0e6;margin-top:10px;min-height:18px}
.card-number{font-size:13px;color:#d7cde3;margin-top:8px}
</style>
</head>
<body>
<main class="game">

<section id="home">
 <div class="headphones">🎧</div>
 <h1>GUESS THE TRACK</h1>
 <p class="sub">Scansiona una carta per iniziare la sfida.</p>
 <button class="scan" id="scanBtn">📷 SCANSIONA CARTA</button>
</section>

<section id="scanner" class="hidden">
 <div class="headphones">🎧</div>
 <div class="scanner-title">SCANSIONA LA CARTA</div>
 <p class="sub">Inquadra il QR della carta.</p>
 <div id="reader"></div>
 <div class="status" id="scanStatus"></div>
 <button class="cancel" id="cancelBtn">← ANNULLA</button>
</section>

<section id="play" class="hidden">
 <div class="headphones">🎧</div>
 <h1>GUESS THE TRACK</h1>
 <p class="sub">Premi Play, ascolta il brano e prova a indovinare.</p>

 <div class="amazon-shell">
   <iframe id="amazonPlayer" allow="autoplay; encrypted-media"></iframe>
   <div class="listen-cover">ASCOLTA</div>
 </div>

 <div class="helper">Premi il pulsante Play nella zona a sinistra.</div>
 <div class="card-number" id="cardNumber"></div>

 <button class="reveal" id="revealBtn">👁 MOSTRA LA RISPOSTA</button>

 <section id="answer" class="hidden">
   <div class="year" id="year"></div>
   <div class="artist" id="artist"></div>
   <div class="song" id="song"></div>
 </section>

 <button class="scan hidden" id="scanAgainBtn">📷 SCANSIONA UN’ALTRA CARTA</button>
</section>

</main>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
/*
  DATABASE CARTE
  Per ora manteniamo la traccia Amazon che abbiamo verificato nel test.
  Qui inseriremo progressivamente tutte le carte.
*/
const cards = {
 "030": {
   track:"B07VRWKJNK",
   embedId:"DVlR8oYrhg",
   year:"TEST",
   artist:"Carta 030",
   title:"Titolo e artista da completare"
 }
};

const home = document.getElementById("home");
const scanner = document.getElementById("scanner");
const play = document.getElementById("play");
const answer = document.getElementById("answer");
const statusEl = document.getElementById("scanStatus");
let qr = null;

function showOnly(el){
 [home,scanner,play].forEach(x=>x.classList.add("hidden"));
 el.classList.remove("hidden");
}

function normalizeCard(value){
 try{
   const u = new URL(value);
   const c = u.searchParams.get("card");
   if(c) return c.padStart(3,"0");
 }catch(e){}
 const m = String(value).match(/(?:card=)?(\d{1,3})/i);
 return m ? m[1].padStart(3,"0") : null;
}

function openCard(number){
 const c = cards[number];
 if(!c){
   statusEl.textContent = "Carta " + number + " non ancora presente nel database.";
   return;
 }
 stopScanner();
 document.getElementById("amazonPlayer").src =
   "https://music.amazon.it/embed/" + c.track +
   "/?id=" + c.embedId +
   "&marketplaceId=APJ6JRA9NG5V4&musicTerritory=IT";

 document.getElementById("cardNumber").textContent = "Carta " + number;
 document.getElementById("year").textContent = c.year;
 document.getElementById("artist").textContent = c.artist;
 document.getElementById("song").textContent = c.title;
 answer.classList.add("hidden");
 document.getElementById("revealBtn").classList.remove("hidden");
 document.getElementById("scanAgainBtn").classList.add("hidden");
 showOnly(play);
}

async function startScanner(){
 showOnly(scanner);
 statusEl.textContent = "";
 if(!window.Html5Qrcode){
   statusEl.textContent = "Scanner non disponibile. Ricarica la pagina.";
   return;
 }
 qr = new Html5Qrcode("reader");
 try{
   await qr.start(
     {facingMode:"environment"},
     {fps:10, qrbox:{width:220,height:220}},
     decodedText=>{
       const n = normalizeCard(decodedText);
       if(n) openCard(n);
       else statusEl.textContent = "QR non riconosciuto.";
     },
     ()=>{}
   );
 }catch(e){
   statusEl.textContent = "Non riesco ad aprire la fotocamera. Controlla il permesso fotocamera.";
 }
}

async function stopScanner(){
 if(qr){
   try{ await qr.stop(); }catch(e){}
   try{ qr.clear(); }catch(e){}
   qr=null;
 }
}

document.getElementById("scanBtn").onclick=startScanner;
document.getElementById("scanAgainBtn").onclick=startScanner;

document.getElementById("cancelBtn").onclick=async()=>{
 await stopScanner();
 showOnly(home);
};

document.getElementById("revealBtn").onclick=function(){
 answer.classList.remove("hidden");
 document.getElementById("scanAgainBtn").classList.remove("hidden");
 this.classList.add("hidden");
};

/* Permette anche di aprire direttamente:
   .../index.html?card=030
*/
const initial = new URLSearchParams(location.search).get("card");
if(initial) openCard(initial.padStart(3,"0"));
</script>
</body>
</html>
