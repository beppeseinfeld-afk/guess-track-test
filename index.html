<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171228">
<title>Amazon Embed Mask Test</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:#171228;color:#fff;
  font-family:Arial,Helvetica,sans-serif;padding:18px
}
.app{max-width:520px;margin:auto}
.card{
  background:#241c3a;border-radius:30px;padding:24px 18px;
  box-shadow:0 18px 48px rgba(0,0,0,.35);text-align:center
}
.logo{font-size:60px}
h1{font-size:31px;margin:8px 0}
p{opacity:.8;line-height:1.45}
.player-wrap{
  position:relative;
  margin-top:20px;
  height:352px;
  border-radius:22px;
  overflow:hidden;
  background:#111;
  box-shadow:0 10px 28px rgba(0,0,0,.25)
}
.player-wrap iframe{
  display:block;width:100%;height:352px;border:0;
}
/* Maschera la zona con copertina/titolo/artista.
   pointer-events:none = i tocchi passano comunque all'iframe. */
.mystery-mask{
  position:absolute;
  z-index:5;
  left:0;right:0;top:0;
  height:248px;
  pointer-events:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 35%,rgba(255,122,162,.18),transparent 34%),
    linear-gradient(180deg,#241c3a 0%,#171228 100%);
  border-bottom:2px solid rgba(255,209,102,.55);
}
.mask-headphones{font-size:62px;line-height:1}
.mask-title{font-size:28px;font-weight:900;margin-top:8px}
.mask-sub{font-size:14px;opacity:.72;margin-top:6px}
.controls-note{
  font-size:13px;opacity:.7;margin:10px 0 0
}
button{
  width:100%;border:0;border-radius:18px;padding:16px;margin-top:14px;
  font-size:18px;font-weight:800;cursor:pointer
}
.reveal{background:#ff7aa2;color:#21111a}
#answer{
  display:none;margin-top:18px;padding:22px;border-radius:22px;
  background:#fff8ea;color:#171228
}
.year{font-size:58px;font-weight:900;color:#d14d72}
.artist{font-size:22px;font-weight:900;margin-top:8px}
.title{font-size:20px;font-weight:800;margin-top:6px;color:#6b3faf}
</style>
</head>
<body>
<main class="app">
<section class="card">
  <div class="logo">🎧</div>
  <h1>GUESS THE TRACK</h1>
  <p>Il titolo Amazon è nascosto. Usa i controlli del player nella parte inferiore.</p>

  <div class="player-wrap">
    <iframe
      id="AmazonMusicEmbedB07VRWKJNK"
      src="https://music.amazon.it/embed/B07VRWKJNK/?id=DVlR8oYrhg&marketplaceId=APJ6JRA9NG5V4&musicTerritory=IT"
      allow="autoplay; encrypted-media">
    </iframe>

    <div class="mystery-mask">
      <div class="mask-headphones">🎧</div>
      <div class="mask-title">GUESS THE TRACK</div>
      <div class="mask-sub">Titolo e artista nascosti</div>
    </div>
  </div>

  <div class="controls-note">La fascia inferiore del player Amazon rimane utilizzabile.</div>

  <button class="reveal" id="revealBtn">👁 MOSTRA LA RISPOSTA</button>

  <div id="answer">
    <div class="year">TEST</div>
    <div class="artist">Carta 030</div>
    <div class="title">Titolo/artista da completare</div>
  </div>
</section>
</main>

<script>
document.getElementById("revealBtn").onclick=function(){
  document.getElementById("answer").style.display="block";
  this.style.display="none";
};
</script>
</body>
</html>
