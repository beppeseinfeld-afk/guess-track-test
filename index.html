<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171228">
<title>Amazon Embed Test</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#171228;color:#fff;font-family:Arial,Helvetica,sans-serif;padding:18px}
.app{max-width:520px;margin:auto}
.card{background:#241c3a;border-radius:30px;padding:24px 18px;box-shadow:0 18px 48px rgba(0,0,0,.35);text-align:center}
.logo{font-size:60px}
h1{font-size:31px;margin:8px 0}
p{opacity:.8;line-height:1.45}
.player-wrap{margin-top:20px;border-radius:22px;overflow:hidden;background:#111;box-shadow:0 10px 28px rgba(0,0,0,.25)}
button{width:100%;border:0;border-radius:18px;padding:16px;margin-top:14px;font-size:18px;font-weight:800;cursor:pointer}
.reveal{background:#ff7aa2;color:#21111a}
.secondary{background:#fff;color:#171228}
#answer{display:none;margin-top:18px;padding:22px;border-radius:22px;background:#fff8ea;color:#171228}
.year{font-size:58px;font-weight:900;color:#d14d72}
.artist{font-size:22px;font-weight:900;margin-top:8px}
.title{font-size:20px;font-weight:800;margin-top:6px;color:#6b3faf}
.note{font-size:13px;opacity:.65;margin-top:14px}
</style>
</head>
<body>
<main class="app">
<section class="card">
  <div class="logo">🎧</div>
  <h1>GUESS THE TRACK</h1>
  <p>Test separato: il player Amazon Music rimane dentro questa pagina.</p>

  <div class="player-wrap">
    <iframe
      id="AmazonMusicEmbedB07VRWKJNK"
      src="https://music.amazon.it/embed/B07VRWKJNK/?id=DVlR8oYrhg&marketplaceId=APJ6JRA9NG5V4&musicTerritory=IT"
      width="100%"
      height="352"
      frameborder="0"
      style="border-radius:20px;max-width:500px"
      allow="autoplay; encrypted-media">
    </iframe>
  </div>

  <button class="reveal" id="revealBtn">👁 MOSTRA LA RISPOSTA</button>

  <div id="answer">
    <div class="year">TEST</div>
    <div class="artist">Carta 030</div>
    <div class="title">Titolo/artista da completare</div>
  </div>

  <button class="secondary" onclick="location.reload()">↻ RICARICA TEST</button>
  <div class="note">Se il player riproduce senza aprire l'app Amazon, il test è riuscito.</div>
</section>
</main>

<script>
document.getElementById("revealBtn").onclick=function(){
  document.getElementById("answer").style.display="block";
  this.style.display="none";
};
</script>
</body>
</html>
