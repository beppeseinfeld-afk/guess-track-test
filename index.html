<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171228">
<title>Amazon Play Only Test</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:#171228;color:#fff;
  font-family:Arial,Helvetica,sans-serif;padding:18px
}
.app{max-width:520px;margin:auto}
.card{
  background:#241c3a;border-radius:30px;padding:24px 18px;
  box-shadow:0 18px 48px rgba(0,0,0,.35);text-align:center
}
.logo{font-size:60px}
h1{font-size:31px;margin:8px 0}
p{opacity:.8;line-height:1.45}

/* Finestra che mostra solo la fascia bassa del player */
.player-window{
  position:relative;
  width:100%;
  height:110px;
  margin-top:20px;
  overflow:hidden;
  border-radius:20px;
  background:#171228;
  border:2px solid rgba(255,209,102,.55);
}

/* Player reale Amazon */
.player-window iframe{
  position:absolute;
  left:0;
  top:-242px;
  width:100%;
  height:352px;
  border:0;
  display:block;
}

/* Copriamo SOLO la parte destra con le scritte.
   Lasciamo libera la zona sinistra dove sta il vero Play. */
.text-cover{
  position:absolute;
  z-index:5;
  top:0;
  right:0;
  width:calc(100% - 92px);
  height:100%;
  background:linear-gradient(180deg,#ffd166,#ffbd3d);
  pointer-events:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#211600;
  font-size:20px;
  font-weight:900;
  letter-spacing:.2px;
}

.play-label{
  position:absolute;
  z-index:6;
  left:7px;
  bottom:7px;
  width:78px;
  height:78px;
  border-radius:18px;
  border:2px solid rgba(255,255,255,.25);
  pointer-events:none;
}

.note{font-size:13px;opacity:.7;margin-top:10px}

button{
  width:100%;border:0;border-radius:18px;padding:16px;margin-top:14px;
  font-size:18px;font-weight:800;cursor:pointer
}
.reveal{background:#ff7aa2;color:#21111a}

#answer{
  display:none;margin-top:18px;padding:22px;border-radius:22px;
  background:#fff8ea;color:#171228
}
.year{font-size:58px;font-weight:900;color:#d14d72}
.artist{font-size:22px;font-weight:900;margin-top:8px}
.title{font-size:20px;font-weight:800;margin-top:6px;color:#6b3faf}
</style>
</head>
<body>
<main class="app">
<section class="card">
  <div class="logo">🎧</div>
  <h1>GUESS THE TRACK</h1>
  <p>Il vero Play Amazon resta scoperto. Le scritte Amazon vengono nascoste.</p>

  <div class="player-window">
    <iframe
      id="AmazonMusicEmbedB07VRWKJNK"
      src="https://music.amazon.it/embed/B07VRWKJNK/?id=DVlR8oYrhg&marketplaceId=APJ6JRA9NG5V4&musicTerritory=IT"
      allow="autoplay; encrypted-media">
    </iframe>

    <div class="text-cover">ASCOLTA</div>
    <div class="play-label"></div>
  </div>

  <div class="note">
    Premi direttamente il vero pulsante Play nella zona a sinistra.
  </div>

  <button class="reveal" id="revealBtn">👁 MOSTRA LA RISPOSTA</button>

  <div id="answer">
    <div class="year">TEST</div>
    <div class="artist">Carta 030</div>
    <div class="title">Titolo/artista da completare</div>
  </div>
</section>
</main>

<script>
document.getElementById("revealBtn").onclick=function(){
  document.getElementById("answer").style.display="block";
  this.style.display="none";
};
</script>
</body>
</html>
